# GitHub's rulesets protect the branches. This holds the conventions that are
# written down in CLAUDE.md and docs/ and were enforced by nobody.
#
# Each merge_protections entry reports as its own check on the pull request,
# and only when its "if" matches, so a docs change is not asked about browsers.

merge_protections_settings:
  # Nothing merges itself. A pull request is auto-merged only once a human has
  # put the auto-merge label on it, and only after it would have merged anyway.
  auto_merge_conditions:
    - label = auto-merge

merge_protections:
  - name: Links an issue
    description: >
      Every pull request names the issue it closes, so the board reflects the
      work. Release and back-merge chores roll up work that is already linked.
    if:
      - base = develop
      - -author = dependabot[bot]
      - -head ~= ^chore/(release|main-back-into-develop)
    success_conditions:
      - body ~= (?i)\b(close[sd]?|fix(e[sd])?|resolve[sd]?|part of)\s+#\d+

  - name: No assistant attribution
    description: >
      No Co-Authored-By, Signed-off-by or generated-by line naming an assistant,
      in the commits or the description. Human sign-off for the DCO is separate
      and is checked by its own workflow.
    if:
      - -author = dependabot[bot]
    success_conditions:
      - -body ~= (?i)(co-authored-by|signed-off-by).*(claude|copilot|chatgpt|gpt-|gemini|anthropic|openai)
      - -body ~= (?i)generated with
      - -commits[*].commit_message ~= (?i)(co-authored-by|signed-off-by).*(claude|copilot|chatgpt|gpt-|gemini|anthropic|openai)
      - -commits[*].commit_message ~= (?i)generated with \[

  - name: Plain prose
    description: >
      No em dashes, in the title or the description. The repository writes
      plain technical prose and the rule is easier to keep than to undo later.
    if:
      - -author = dependabot[bot]
    success_conditions:
      - -title ~= —
      - -body ~= —

  - name: Interface change was opened in a browser
    description: >
      The emitted shells are strings TypeScript cannot see inside. The suite has
      passed on an application that did not boot, three merges running. Say in
      the description what you opened, or label it browser-checked.
    if:
      - -author = dependabot[bot]
      - or:
          - files ~= ^src/ui/
          - files ~= ^src/site/
    success_conditions:
      - or:
          - label = browser-checked
          - body ~= (?i)browser

  - name: A release bumps the version
    description: >
      main only moves through a release. A promotion that forgets the bump
      leaves the image tag and the chart claiming the version before it.
    if:
      - base = main
      - -label = allow-direct-to-main
    success_conditions:
      - files = package.json
      - files = CHANGELOG.md
      - files = deploy/helm/citegeo/Chart.yaml
      - files = deploy/kubernetes/citegeo.yaml

  - name: Green on everything main requires
    description: >
      The same six checks main's ruleset names, asserted on the way into
      develop too, where the ruleset requires nothing at all.
    if:
      - -draft
    success_conditions:
      - check-success = Build and test (Node 22)
      - check-success = Build and test (Node 26)
      - check-success = Helm chart
      - check-success = Docker image builds
      - check-success = Check the CLA signature

queue_rules:
  - name: default
    # A merge commit, never a squash. The release flow compares ancestry
    # between main and develop, and a squash loses it.
    merge_method: merge
    update_method: merge
    queue_conditions:
      - -draft
      - -conflict
    merge_conditions:
      - check-success = Build and test (Node 22)
      - check-success = Build and test (Node 26)
      - check-success = Helm chart
      - check-success = Docker image builds
      - check-success = Check the CLA signature

pull_request_rules:
  - name: Delete the head branch once it has merged
    conditions:
      - merged
    actions:
      delete_head_branch:

  - name: Say so when a pull request stops merging cleanly
    conditions:
      - conflict
      - -closed
    actions:
      label:
        add:
          - conflict
      comment:
        message: >
          This no longer merges cleanly into `{{base}}`. Rebase or merge the
          base branch in, and the label clears itself.

  - name: Clear the conflict label once it merges cleanly again
    conditions:
      - -conflict
      - label = conflict
    actions:
      label:
        remove:
          - conflict
