name: CLA

# pull_request_target is safe here: no step checks out or runs the pull request code.
on:  # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  cla:
    name: Check the CLA signature
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only react to the signing phrase, never to ordinary PR comments.
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Signatures are stored in this repository, so no external service and no
      # paid plan is involved. The branch keeps them out of main's history.
      # Archived upstream but still working; pinned by commit so it cannot change.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1  # zizmor: ignore[archived-uses]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ankit373/citegeo/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ankit373,dependabot[bot],dependabot-preview[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read the
            [CLA](https://github.com/ankit373/citegeo/blob/main/CLA.md) and sign it
            by posting the sentence below as a comment on this pull request. You
            only ever do this once.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Every contributor on this pull request has signed the CLA.
