name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines >=22, so prove the floor and the
        # version the image actually ships.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck and unit tests
        run: npm run self-check

      # The unit suite asserts on HTML strings and never executes the page, so a
      # broken inline script, an undefined name or a stray CSS brace all pass it.
      - name: Check every script and stylesheet the server emits
        run: node scripts/check-emitted-scripts.mjs

      - name: Check documentation links resolve
        run: node scripts/check-doc-links.mjs

      # site/ is generated and committed so a static host can serve it. If the
      # source changed and it was not rebuilt, the published page is stale.
      - name: The committed marketing site matches its source
        run: |
          node scripts/build-site.mjs
          git diff --exit-code -- site \
            || { echo "site/ is stale; regenerate with: npm run build && node scripts/build-site.mjs"; exit 1; }

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v4.2.2

      - run: helm lint deploy/helm/citegeo

      # Render every optional piece, not just the defaults.
      - name: Render with all features enabled
        run: |
          helm template citegeo deploy/helm/citegeo \
            --set ingress.enabled=true \
            --set worker.enabled=true \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set secrets.create=true \
            --set secrets.data.OPENROUTER_API_KEY=placeholder \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

      # kubeval is deprecated and its action unmaintained since 2020; kubeconform
      # replaces it, pinned by checksum and allowed to fail the job.
      - name: Validate the rendered manifests
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          # A 504 from the release host failed this check on main once. The
          # checksum below is what makes a retry safe to add.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/render.yaml

      - name: The checked-in manifests match the chart
        run: |
          helm template citegeo deploy/helm/citegeo --namespace citegeo > /tmp/fresh.yaml
          # Skip the hand-written header; compare from the first document marker.
          awk '/^---$/{found=1} found' deploy/kubernetes/citegeo.yaml > /tmp/committed.yaml
          # CI pins the Helm major that generated the committed file, but a
          # contributor on Helm 3 emits different blank lines between documents.
          diff -u -B /tmp/committed.yaml /tmp/fresh.yaml \
            || { echo "deploy/kubernetes/citegeo.yaml is stale; regenerate with: helm template citegeo deploy/helm/citegeo --namespace citegeo"; exit 1; }

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Catches a Dockerfile that copies files which no longer exist.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: citegeo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container serves health and its brand assets
        run: |
          docker run -d --name citegeo -p 8787:8787 citegeo:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/health
          curl -fsS -o /dev/null http://127.0.0.1:8787/assets/brand/citegeo-lockup.svg
          docker rm -f citegeo

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # The whole lockfile, development tools included: they run in CI and in the image build.
      - name: No high or critical advisory in the lockfile
        run: npm audit --audit-level=high

      # Stops a pull request adding a vulnerable package before it is in the lockfile on develop.
      - name: No vulnerable dependency added by this change
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

      # Template injection, over-broad tokens, unpinned third-party actions; policy in .github/zizmor.yml.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --format github .github/workflows

  mergify:
    name: Merge queue config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # develop is the default branch, so a broken .mergify.yml stops the queue the moment it merges.
      - name: .mergify.yml matches Mergify's schema
        run: |
          pipx run check-jsonschema==0.39.0 \
            --schemafile https://docs.mergify.com/mergify-configuration-schema.json .mergify.yml

  gate:
    name: PR Gate
    # One check for Mergify and for main's ruleset to name. The ruleset used to
    # name each matrix job by string, and a matrix change left it requiring a
    # job that could never report, with no bypass actor.
    needs: [test, chart, docker, audit, workflows, mergify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every qualifying job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          failed=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not succeed: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All qualifying jobs succeeded."
