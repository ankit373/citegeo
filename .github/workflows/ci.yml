name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines >=22, so prove the floor and the
        # version the image actually ships.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck and unit tests
        run: npm run self-check

      # The unit suite asserts on HTML strings and never executes the page, so a
      # broken inline script, an undefined name or a stray CSS brace all pass it.
      - name: Check every script and stylesheet the server emits
        run: node scripts/check-emitted-scripts.mjs

      - name: Check documentation links resolve
        run: node scripts/check-doc-links.mjs

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.2

      - run: helm lint deploy/helm/citegeo

      # Render every optional piece, not just the defaults.
      - name: Render with all features enabled
        run: |
          helm template citegeo deploy/helm/citegeo \
            --set ingress.enabled=true \
            --set worker.enabled=true \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set secrets.create=true \
            --set secrets.data.OPENROUTER_API_KEY=placeholder \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

      # kubeval is deprecated and its action unmaintained since 2020; kubeconform
      # replaces it, pinned by checksum and allowed to fail the job.
      - name: Validate the rendered manifests
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/render.yaml

      - name: The checked-in manifests match the chart
        run: |
          helm template citegeo deploy/helm/citegeo --namespace citegeo > /tmp/fresh.yaml
          # Skip the hand-written header; compare from the first document marker.
          awk '/^---$/{found=1} found' deploy/kubernetes/citegeo.yaml > /tmp/committed.yaml
          # CI pins the Helm major that generated the committed file, but a
          # contributor on Helm 3 emits different blank lines between documents.
          diff -u -B /tmp/committed.yaml /tmp/fresh.yaml \
            || { echo "deploy/kubernetes/citegeo.yaml is stale; regenerate with: helm template citegeo deploy/helm/citegeo --namespace citegeo"; exit 1; }

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Catches a Dockerfile that copies files which no longer exist.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: citegeo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container serves health and its brand assets
        run: |
          docker run -d --name citegeo -p 8787:8787 citegeo:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/health
          curl -fsS -o /dev/null http://127.0.0.1:8787/assets/brand/citegeo-lockup.svg
          docker rm -f citegeo
