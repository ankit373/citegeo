{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "citegeo.fullname" . }}
  labels:
    {{- include "citegeo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "citegeo.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: 8787
          protocol: TCP
    {{- else }}
    # No sources declared, so nothing may reach it. The app has no auth of its
    # own, and a default-open policy would expose every stored answer.
    []
    {{- end }}
  egress:
    # DNS, then outbound HTTPS so provider APIs stay reachable.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
